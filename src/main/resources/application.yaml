spring:
  application:
    name: Personal-Blog

  datasource:
    url: jdbc:mysql://localhost:3306/personal_blog?useSSL=false&serverTimezone=UTC
    # username/password: cung cấp trong application-local.yaml (không commit)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    access-token-expiration: 900000      # 15 phút, tính bằng ms
    refresh-token-expiration: 604800000  # 7 ngày
    # secret: cung cấp trong application-local.yaml (không commit)

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  # api-key/api-secret: cung cấp trong application-local.yaml (không commit)