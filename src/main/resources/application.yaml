spring:
  application:
    name: Personal-Blog

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/personal_blog?useSSL=false&serverTimezone=UTC}
    # username/password: cung cấp trong application-local.yaml (không commit)
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  jwt:
    access-token-expiration: 900000      # 15 phút, tính bằng ms
    refresh-token-expiration: 604800000  # 7 ngày
    secret: ${APP_JWT_SECRET:}
    # secret: cung cấp trong application-local.yaml (không commit)
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  # api-key/api-secret: cung cấp trong application-local.yaml (không commit)
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}